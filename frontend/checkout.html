<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — 5G Foods</title>
  <link rel="icon" type="image/png" href="images/logo/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/checkout.css" />

  <!-- Paystack Inline script -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo" aria-label="5G Foods home">
        <img src="images/logo/logo.png" alt="5G Foods logo" class="navbar__logo-img" />
        <span class="navbar__logo-text">5G <em>Foods</em></span>
      </a>
    </div>
  </header>

  <main class="checkout-page">
    <div class="container checkout-page__grid">

      <!-- ORDER SUMMARY -->
      <section class="checkout-summary">
        <h2>Order Summary</h2>
        <div id="checkoutItems" class="checkout-summary__items">
          <p>Loading your order...</p>
        </div>
        <div class="checkout-summary__total">
          <span>Total</span>
          <span id="checkoutTotal">₦0</span>
        </div>
      </section>

      <!-- DELIVERY DETAILS -->
      <section class="checkout-form">
        <h2>Delivery Details</h2>
        <form id="checkoutForm">
          <div class="checkout-form__field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required />
          </div>
          <div class="checkout-form__field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required />
          </div>
          <div class="checkout-form__field">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>
          <div class="checkout-form__field">
            <label for="address">Delivery Address</label>
            <textarea id="address" rows="3" required></textarea>
          </div>
          <div class="checkout-form__field">
            <label for="notes">Order Notes (optional)</label>
            <textarea id="notes" rows="2"></textarea>
          </div>

          <button type="submit" class="btn btn--primary btn--block" id="payNowBtn">
            Pay Now
          </button>
        </form>
      </section>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
