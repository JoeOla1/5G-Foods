<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="page-logo">
    <img src="./images/5g logo.jpeg" alt="5g logo" height="100" width="100" style="position: absolute; top: 10px; left: 10px;">
</div>        
    
    <div class="login-box">
        <h1>Login</h1>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" required placeholder="Email" id="email" name="email">
            
            <br /><label for="password">Password</label>
            <input type="password" required name="password" id="password">

            <div id="loginError" class="form-error"></div>
            <div id="loginSuccess" class="form-success"></div>

            <div class="login-btn">
            <br /><button type="submit">Login</button>
            </div>
        </form>

        <div class="divider">or continue with</div>

        <div id="googleButtonContainer" style="display:flex; justify-content:center;"></div>
    </div>

    <p class="signup-link">
  Don't have an account?
  <a href="signup.html">Sign Up</a>
</p>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
<script src="js/google-auth.js"></script>
</body>
</html>
